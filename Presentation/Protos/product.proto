syntax = "proto3";

package Presentation.Protos;
option csharp_namespace = "Presentation.Protos";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum ProductType {
	PRODUCT_TYPE_GENERAL = 0;
	PRODUCT_TYPE_HOUSEHOLD_CHEMICALS = 1;
	PRODUCT_TYPE_ELECTRONICS = 2;
	PRODUCT_TYPE_FOOD = 3;
}

message ProductResponse {
	string id = 1;
	string name = 2;
	double price = 3;
	double weight = 4;
	ProductType type = 5;
	google.protobuf.Timestamp created_at = 6;
	int32 warehouse_number = 7;
}

// Product requests
message CreateProductRequest {
	string name = 1;
	double price = 2;
	double weight = 3;
	ProductType type = 4;	
	int32 warehouse_number = 5;
}

message GetProductsRequest {
	optional google.protobuf.Timestamp created_at = 1;
	optional ProductType type = 2;
	optional int32 warehouse_number = 3;
	int32 page = 4;
	int32 page_size = 5;
}

message GetProductByIdRequest {
	string id = 1;
}

message UpdateProductRequest {
	string id = 1;
	optional string name = 2;
	optional double price = 3;
	optional double weight = 4;
	optional ProductType type = 5;
	optional int32 warehouse_number = 6;
}

//  Product responses
message CreateProductResponse {
	string id = 1;
}

message GetProductsResponse {
	repeated ProductResponse products = 1;
	int32 total_count = 2;
}

message GetProductByIdResponse {
 ProductResponse product = 1;
}

message UpdateProductResponse {
 ProductResponse product = 1;
}


service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse) {
	option (google.api.http) = {
	  post: "/grps/products"
	  body: "*"
	};
  }

  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse) {
	option (google.api.http) = {
	  get: "/grps/products"
	};
  }

  rpc GetProductById (GetProductByIdRequest) returns (GetProductByIdResponse) {
	option (google.api.http) = {
	  get: "/grps/products/{id}"
	};
  }

  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse) {
	option (google.api.http) = {
	  patch: "/grps/products/update"
	  body: "*"
	};
  }
}
